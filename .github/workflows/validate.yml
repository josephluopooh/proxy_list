name: Validate proxy profiles

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install test dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -r tests/requirements.txt
      - name: Download pinned official engines and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 --output sing-box.tar.gz \
            https://github.com/SagerNet/sing-box/releases/download/v1.14.3/sing-box-1.14.3-linux-amd64.tar.gz
          curl --fail --location --retry 3 --output mihomo.gz \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.33/mihomo-linux-amd64-v1.19.33.gz
          echo 'e2bdf179c15a3652955dc44867e33ca0965c9c9b91b34267dcc5a5d639a5feee  sing-box.tar.gz' | sha256sum --check
          echo '132f6f3edf9a65e62f04853aed3358472e0b2b7666daa8419edfa2ddf5bb6323  mihomo.gz' | sha256sum --check
          tar -xzf sing-box.tar.gz
          gzip -dc mihomo.gz > mihomo
          chmod +x mihomo
      - name: Check snapshots, policies and engine compatibility offline
        env:
          SING_BOX: ${{ runner.temp }}/sing-box-1.14.3-linux-amd64/sing-box
          MIHOMO: ${{ runner.temp }}/mihomo
        run: |
          "$RUNNER_TEMP/venv/bin/python" scripts/sync_rule_sets.py
          "$RUNNER_TEMP/venv/bin/python" -m unittest discover -s tests -v
